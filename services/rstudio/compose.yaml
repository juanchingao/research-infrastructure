services:
  rstudio:
    build:
      context: .
      dockerfile: Dockerfile

    image: research-rstudio:r4.6.0-rstudio2026.07.1-147
    container_name: research-rstudio

    restart: unless-stopped

    ports:
      - "127.0.0.1:8787:8787"

    environment:
      PASSWORD: ${RSTUDIO_PASSWORD}
      RENV_PATHS_CACHE: /data/.cache/renv

    volumes:
      - /data:/data
      - /data/raw/parisehis:/data/raw/parisehis:ro
      - /data/rstudio-home:/home/rstudio

    working_dir: /data

    networks:
      - rstudio

    security_opt:
      - no-new-privileges:true

networks:
  rstudio:
    # OpenStack tenant networks add encapsulation overhead. Keeping the
    # container MTU below the underlay MTU prevents TLS handshakes from
    # stalling when larger server responses cannot traverse the Docker bridge.
    name: research-rstudio-mtu1400
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"

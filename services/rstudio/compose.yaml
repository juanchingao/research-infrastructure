services:
  rstudio:
    build:
      context: .
      dockerfile: Dockerfile

    image: research-rstudio:r4.6.0-rstudio2026.07.1-147
    container_name: research-rstudio

    restart: unless-stopped

    ports:
      - "127.0.0.1:8787:8787"

    environment:
      PASSWORD: ${RSTUDIO_PASSWORD}
      RENV_PATHS_CACHE: /data/.cache/renv

    volumes:
      - /data:/data
      - /data/rstudio-home:/home/rstudio

    working_dir: /data

    security_opt:
      - no-new-privileges:true

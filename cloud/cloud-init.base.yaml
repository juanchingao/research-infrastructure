#cloud-config
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - git
  - docker.io
  - docker-compose-v2

runcmd:
  - [ systemctl, enable, --now, docker ]
  - [ usermod, -aG, docker, ubuntu ]
  - [ sh, -c, "echo '[research-infrastructure] cloud-init complete' >> /var/log/research-bootstrap.log" ]

final_message: "cloud-init finalizado. Revisa /var/log/cloud-init-output.log y /var/log/research-bootstrap.log"

